# Friend Circle Lite - ImYufish optimized (fork)
# Remote source: yujingblog.top

debug: false

spider_settings:
  enable: true
  source: remote
  json_url: "https://yujingblog.top/friend.json"
  article_count: 5
  list_key: "friends"
  friends_input:
    rename:
      name: "title"
      link: "siteurl"
      avatar: "imgurl"
      linkpage: ""
      verified: ""

proxy_settings:
  proxy_url: ""

merge_settings:
  enable: false
  remote_base_url: "https://fc.liushen.fun"
  merge_article_data: true
  merge_link_check_data: true

link_check:
  max_age_hours: 24
  timeout: 25
  max_workers: 10
  enable_backlink_check: true
  backlink_headless: true

postprocess:
  enable: false

email_push:
  enable: false

rss_subscribe:
  enable: false
